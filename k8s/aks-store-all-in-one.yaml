apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: documentdb
spec:
  serviceName: documentdb
  replicas: 1
  selector:
    matchLabels:
      app: documentdb
  template:
    metadata:
      labels:
        app: documentdb
    spec:
      enableServiceLinks: false 
      containers:
      - name: documentdb
        image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.112.0
        args: ["--username", "username", "--password", "password"]
        ports:
        - containerPort: 10260
          name: documentdb
        resources:
          requests: { cpu: 5m, memory: 75Mi }
          limits: { cpu: 25m, memory: 1024Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: documentdb
spec:
  ports:
  - port: 10260
  selector:
    app: documentdb
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
data:
  RABBITMQ_DEFAULT_USER: dXNlcm5hbWU=
  RABBITMQ_DEFAULT_PASS: cGFzc3dvcmQ=
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4.3.2-management-alpine
        ports:
        - containerPort: 5672
          name: rabbitmq-amqp
        - containerPort: 15672
          name: rabbitmq-http
        envFrom:
        - secretRef:
            name: rabbitmq-secrets
        resources:
          requests: { cpu: 10m, memory: 128Mi }
          limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: rabbitmq-amqp
    port: 5672
    targetPort: 5672
  - name: rabbitmq-http
    port: 15672
    targetPort: 15672
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-configs
data:
  ORDER_QUEUE_PORT: "5672"
  ORDER_QUEUE_HOSTNAME: "rabbitmq"
  ORDER_QUEUE_NAME: "orders"
  FASTIFY_ADDRESS: "0.0.0.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
data:
  ORDER_QUEUE_USERNAME: dXNlcm5hbWU=
  ORDER_QUEUE_PASSWORD: cGFzc3dvcmQ=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: acrpipelinesjava14858.azurecr.io/order-service:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: order-service-configs
        - secretRef:
            name: order-service-secrets
        resources:
          requests: { cpu: 1m, memory: 50Mi }
          limits: { cpu: 100m, memory: 256Mi }
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.37.0
        command: ["sh", "-c", "until nc -zv rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;"]
        resources:
          requests: { cpu: 1m, memory: 50Mi }
          limits: { cpu: 100m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: makeline-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: makeline-service
  template:
    metadata:
      labels:
        app: makeline-service
    spec:
      containers:
      - name: makeline-service
        image: acrpipelinesjava14858.azurecr.io/makeline-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: ORDER_QUEUE_URI
          value: "amqp://rabbitmq:5672"
        - name: ORDER_QUEUE_USERNAME
          value: "username"
        - name: ORDER_QUEUE_PASSWORD
          value: "password"
        - name: ORDER_QUEUE_NAME
          value: "orders"
        - name: ORDER_DB_URI
          value: "mongodb://documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true"
        - name: ORDER_DB_NAME
          value: "orderdb"
        - name: ORDER_DB_COLLECTION_NAME
          value: "orders"
        - name: ORDER_DB_USERNAME
          value: "username"
        - name: ORDER_DB_PASSWORD
          value: "password"
        resources:
          requests: { cpu: 1m, memory: 6Mi }
          limits: { cpu: 5m, memory: 20Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: makeline-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3001
    targetPort: 3001
  selector:
    app: makeline-service
---
apiVersion: apps/v1
